<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <title>DMRC | কুইজ পরীক্ষা - ২০২৬ | সাজেশন</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        /* =========================================
           GLOBAL
        ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: "Hind Siliguri", "Noto Sans Bengali", sans-serif;
            color: #ffffff;
            background:
                radial-gradient(circle at 10% 10%, rgba(0, 200, 255, 0.18), transparent 30%),
                radial-gradient(circle at 90% 15%, rgba(124, 92, 255, 0.18), transparent 30%),
                radial-gradient(circle at 50% 100%, rgba(0, 170, 255, 0.10), transparent 35%),
                linear-gradient(135deg, #030711, #07111f, #0a1628);
            padding: 25px 15px;
            overflow-x: hidden;
        }

        /* Background Grid */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.25;
            background-image:
                linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
            background-size: 35px 35px;
            z-index: -1;
        }

        /* =========================================
           MAIN CONTAINER
        ========================================= */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            min-height: calc(100vh - 50px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: rgba(10, 23, 39, 0.72);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 28px;
            overflow: hidden;
            box-shadow:
                0 30px 80px rgba(0,0,0,0.45),
                inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* =========================================
           HEADER
        ========================================= */
        .header {
            text-align: center;
            padding: 45px 25px 35px;
            position: relative;
            border-bottom: 1px solid rgba(255,255,255,0.09);
            background: linear-gradient(180deg, rgba(255,255,255,0.04), transparent);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 7px 16px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #66ddff;
            border: 1px solid rgba(102,221,255,0.25);
            background: rgba(102,221,255,0.07);
            box-shadow: 0 0 25px rgba(102,221,255,0.06);
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #66ddff;
            box-shadow: 0 0 12px #66ddff;
        }

        .college-name {
            margin-top: 20px;
            font-size: clamp(25px, 5vw, 48px);
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -1px;
            background: linear-gradient(90deg, #ffffff, #d9f7ff, #ffffff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .exam-name {
            margin-top: 8px;
            font-size: clamp(20px, 3vw, 30px);
            font-weight: 700;
            color: #cfe7f5;
        }

        /* =========================================
           CONTENT (NOTICE BOX)
        ========================================= */
        .content {
            padding: 40px 30px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notice-card {
            width: 100%;
            max-width: 600px;
            background: linear-gradient(145deg, rgba(255,255,255,0.065), rgba(255,255,255,0.018));
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 21px;
            padding: 45px 25px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .notice-icon {
            font-size: 45px;
            margin-bottom: 18px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .notice-card h2 {
            font-size: clamp(20px, 3vw, 26px);
            font-weight: 700;
            color: #f2f7fb;
            margin-bottom: 12px;
        }

        .notice-card p {
            color: #9fb3c8;
            font-size: 16px;
            line-height: 1.6;
            margin: 0 auto 25px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 50px;
            background: rgba(70,210,255,0.1);
            border: 1px solid rgba(70,210,255,0.25);
            color: #70dcff;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.25s ease;
        }

        .back-btn:hover {
            background: rgba(70,210,255,0.2);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(70,210,255,0.15);
        }

        /* =========================================
           FOOTER
        ========================================= */
        .footer {
            text-align: center;
            padding: 25px 20px;
            border-top: 1px solid rgba(255,255,255,0.08);
            color: #7f94a8;
            font-size: 14px;
            line-height: 1.8;
        }

        .footer strong {
            color: #d9e9f5;
            font-weight: 700;
        }

        .footer .roll {
            font-size: 12px;
            color: #61778c;
        }

        .copyright {
            margin-top: 5px;
            font-size: 11px;
            color: #4f6478;
        }

        /* =========================================
           RESPONSIVE
        ========================================= */
        @media (max-width: 550px) {
            body {
                padding: 10px;
            }
            .container {
                border-radius: 20px;
                min-height: calc(100vh - 20px);
            }
            .header {
                padding: 32px 15px 28px;
            }
            .content {
                padding: 20px 15px;
            }
            .notice-card {
                padding: 30px 15px;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Top Section -->
    <div>
        <!-- HEADER -->
        <header class="header">
            <div class="badge">
                <span class="badge-dot"></span>
                DMRC • SUGGESTION 2026
            </div>

            <h1 class="college-name">
                ড. মাহবুবুর রহমান মোল্লা কলেজ
            </h1>

            <div class="exam-name">
                সাজেশন পেজ - ২০২৬
            </div>
        </header>

        <!-- CONTENT -->
        <main class="content">
            <div class="notice-card">
                <div class="notice-icon">⏳</div>
                <h2>সাজেশন এখনো আপডেট করা হয়নি</h2>
                <p>সাজেশন তৈরির কাজ চলছে। আপডেট করা হলে এই পেজে তা দেখতে পাবেন।</p>
                
                <a href="index.html" class="back-btn">
                    ← হোম পেজে ফিরে যান
                </a>
            </div>
        </main>
    </div>

    <!-- FOOTER -->
    <footer class="footer">
        Developed by
        <strong>
            JOHIRUL ISLAM SAGOR
        </strong>

        <br>

        <span class="roll">
            ROLL - 2042
            &nbsp; • &nbsp;
            SECTION - D
            &nbsp; • &nbsp;
            DMRC
        </span>

        <div class="copyright">
            © 2026 • DMRC QUIZ EXAMINATION
        </div>
    </footer>

</div>

</body>
</html>
