<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>সাজেশন | জহিরুল ইসলাম সাগর</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Hind Siliguri", sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;

      background:
        radial-gradient(circle at 15% 15%, rgba(0, 190, 180, 0.15), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(40, 90, 180, 0.18), transparent 32%),
        linear-gradient(135deg, #030708, #071315 45%, #020506);
      overflow: hidden;
    }

    /* Glossy ambient lights */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      opacity: .45;
    }

    body::before {
      background: #087f78;
      top: -130px;
      left: -100px;
    }

    body::after {
      background: #173d78;
      bottom: -140px;
      right: -100px;
    }

    .container {
      width: 100%;
      max-width: 560px;
      position: relative;
      z-index: 2;
    }

    .card {
      position: relative;
      overflow: hidden;
      padding: 45px 30px 32px;
      border-radius: 30px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.035)
        );

      border: 1px solid rgba(255,255,255,.13);

      box-shadow:
        0 30px 80px rgba(0,0,0,.65),
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 -1px 0 rgba(255,255,255,.04);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      animation: appear .8s ease;
    }

    /* Glossy reflection */
    .card::before {
      content: "";
      position: absolute;
      top: -100px;
      left: -40%;
      width: 180%;
      height: 180px;

      background: linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.13),
        transparent
      );

      transform: rotate(-8deg);
      pointer-events: none;
    }

    .top-line {
      width: 70px;
      height: 4px;
      margin: 0 auto 22px;
      border-radius: 50px;

      background: linear-gradient(
        90deg,
        #0bb9ae,
        #66fff4
      );

      box-shadow:
        0 0 15px rgba(40,255,235,.5);
    }

    .badge {
      display: inline-block;
      padding: 7px 16px;
      border-radius: 50px;
      margin-bottom: 18px;

      background: rgba(0,190,180,.09);
      border: 1px solid rgba(70,255,240,.18);

      color: #8efff5;
      font-size: 13px;
      letter-spacing: .5px;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 20px;

      background: linear-gradient(
        135deg,
        #ffffff,
        #a9fff7
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .message {
      text-align: center;
      font-size: 18px;
      line-height: 1.9;
      color: #e5eeee;
      margin-bottom: 27px;
    }

    .quote {
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 25px;

      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.08);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.05);
    }

    .quote p {
      text-align: center;
      font-size: 19px;
      font-weight: 600;
      color: #ffffff;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      width: 100%;
      border: none;
      outline: none;
      text-decoration: none;

      padding: 15px 20px;
      border-radius: 17px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      font-family: inherit;
      font-size: 16px;
      font-weight: 600;

      cursor: pointer;
      transition: .3s ease;
    }

    .physics-btn {
      color: #03110f;

      background: linear-gradient(
        135deg,
        #70fff3,
        #13bcb1
      );

      box-shadow:
        0 10px 25px rgba(12,190,177,.20),
        inset 0 1px 0 rgba(255,255,255,.55);
    }

    .physics-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 15px 35px rgba(12,190,177,.32);
    }

    .feedback-btn {
      color: #e9ffff;

      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.12);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,.08);
    }

    .feedback-btn:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.09);
    }

    .thanks {
      text-align: center;
      margin-top: 27px;
      color: #aebebe;
      font-size: 15px;
      line-height: 1.8;
    }

    .signature {
      text-align: center;
      margin-top: 20px;
      padding-top: 20px;

      border-top: 1px solid rgba(255,255,255,.08);

      color: #8efff5;
      font-size: 16px;
      font-weight: 600;
    }

    /* Popup */
    .popup {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;

      padding: 25px;
      background: rgba(0,0,0,.65);
      backdrop-filter: blur(10px);

      z-index: 100;
    }

    .popup.active {
      display: flex;
      animation: fadeIn .25s ease;
    }

    .popup-box {
      width: 100%;
      max-width: 400px;
      text-align: center;

      padding: 30px 25px;
      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(25,42,43,.96),
          rgba(5,14,15,.98)
        );

      border: 1px solid rgba(120,255,245,.18);

      box-shadow:
        0 25px 70px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.1);
    }

    .popup-icon {
      font-size: 35px;
      margin-bottom: 15px;
    }

    .popup-box h2 {
      color: #8efff5;
      font-size: 22px;
      margin-bottom: 12px;
    }

    .popup-box p {
      color: #d4dddd;
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 22px;
    }

    .close-btn {
      border: none;
      padding: 11px 28px;
      border-radius: 13px;

      font-family: inherit;
      font-weight: 600;
      cursor: pointer;

      color: #04100f;
      background: linear-gradient(
        135deg,
        #75fff3,
        #12b9ae
      );
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .card {
        padding: 38px 20px 27px;
        border-radius: 25px;
      }

      h1 {
        font-size: 25px;
      }

      .message {
        font-size: 16px;
      }

      .quote p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <section class="card">

      <div class="top-line"></div>

      <div style="text-align:center;">
        <span class="badge">📚 সাজেশন বিভাগ</span>
      </div>

      <h1>সাজেশন সংক্রান্ত বার্তা</h1>

      <div class="quote">
        <p>
          “বাকি সাজেশন পেতে নিয়মিত কলেজে আসুন,<br>
          আমি দিতে পারব না।”
        </p>
      </div>

      <p class="message">
        পদার্থবিজ্ঞান সাজেশন 👇
      </p>

      <div class="buttons">

        <a
          href="physicssuggestion.html"
          class="btn physics-btn"
        >
          পদার্থবিজ্ঞান সাজেশন
        </a>

        <button
          class="btn feedback-btn"
          onclick="showFeedback()"
        >
          💬 ফিডব্যাক দিন
        </button>

      </div>


      <div class="signature">
    ধন্যবাদন্তে<br>
        জহিরুল ইসলাম সাগর
      </div>

    </section>

  </main>


  <!-- Feedback Popup -->
  <div
    class="popup"
    id="feedbackPopup"
    onclick="closeOutside(event)"
  >

    <div class="popup-box">

      <div class="popup-icon">😮‍💨</div>

      <h2>
        আপনার ফিডব্যাক আমার দরকার নেই</h2>

      <button
        class="close-btn"
        onclick="closeFeedback()"
      >
        ঠিক আছে
      </button>

    </div>

  </div>


  <script>

    function showFeedback() {
      document
        .getElementById("feedbackPopup")
        .classList.add("active");
    }

    function closeFeedback() {
      document
        .getElementById("feedbackPopup")
        .classList.remove("active");
    }

    function closeOutside(event) {
      if (event.target.id === "feedbackPopup") {
        closeFeedback();
      }
    }

  </script>

</body>
</html>
```
